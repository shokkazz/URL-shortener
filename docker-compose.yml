services:
  postgres:
    image: postgres:18
    container_name: shortener-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command: ["./migrate"]


  server:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    ports:
      - "${APP_PORT}:${APP_PORT}"

    depends_on:
      postgres:
        condition: service_healthy

    command: ["./server"]


volumes:
  postgres_data: